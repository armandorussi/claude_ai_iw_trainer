<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Berribot Retake Trainer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --bg:#F3F1EA; --surface:#FFFFFF; --surface-2:#EBE7DC; --ink:#1B2127; --ink-dim:#5C646C;
  --accent:#A8681E; --accent-ink:#FFFFFF; --good:#2E7A5F; --critical:#B44B32; --line:rgba(27,33,39,0.11);
  --serif: "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono: ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12161A; --surface:#1B2127; --surface-2:#232A31; --ink:#ECE9E2; --ink-dim:#98A2AA;
    --accent:#E2A33B; --accent-ink:#1B1400; --good:#4CA98A; --critical:#DD6A50; --line:rgba(236,233,226,0.12);
  }
}
:root[data-theme="dark"]{
  --bg:#12161A; --surface:#1B2127; --surface-2:#232A31; --ink:#ECE9E2; --ink-dim:#98A2AA;
  --accent:#E2A33B; --accent-ink:#1B1400; --good:#4CA98A; --critical:#DD6A50; --line:rgba(236,233,226,0.12);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased;}
a{color:var(--accent);}
button{font-family:var(--sans);cursor:pointer;}
button:focus-visible, a:focus-visible, textarea:focus-visible, input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
h1,h2,h3{font-family:var(--serif);font-weight:600;text-wrap:balance;margin:0 0 .4em;}
.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh;}
@media (max-width:760px){.shell{grid-template-columns:1fr;}.rail{position:sticky;top:0;z-index:20;}}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:4px;}
@media (max-width:760px){.rail{border-right:none;border-bottom:1px solid var(--line);flex-direction:row;overflow-x:auto;padding:10px;gap:6px;}}
.brand{font-family:var(--serif);font-size:1.05rem;font-weight:700;padding:4px 10px 18px;color:var(--ink);}
@media (max-width:760px){.brand{display:none;}}
.nav-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;border:none;background:transparent;color:var(--ink-dim);text-align:left;font-size:.92rem;font-weight:500;white-space:nowrap;}
.nav-btn:hover{background:var(--surface-2);color:var(--ink);}
.nav-btn.active{background:var(--surface-2);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent);}
.main{padding:34px 40px 80px;max-width:980px;}
@media (max-width:760px){.main{padding:20px 18px 60px;}}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-dim);font-weight:600;margin-bottom:6px;}
.sub{color:var(--ink-dim);font-size:.98rem;max-width:64ch;margin-bottom:26px;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:14px;}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:26px;}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;}
.stat .n{font-family:var(--serif);font-size:2rem;font-variant-numeric:tabular-nums;line-height:1;}
.stat .l{color:var(--ink-dim);font-size:.78rem;margin-top:6px;}
.stat.strong .n{color:var(--good);} .stat.weak .n{color:var(--accent);} .stat.missed .n{color:var(--critical);}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:600;padding:3px 9px;border-radius:99px;letter-spacing:.02em;}
.chip.strong{background:color-mix(in srgb, var(--good) 16%, transparent);color:var(--good);}
.chip.weak{background:color-mix(in srgb, var(--accent) 16%, transparent);color:var(--accent);}
.chip.missed{background:color-mix(in srgb, var(--critical) 16%, transparent);color:var(--critical);}
.chip.cat{background:var(--surface-2);color:var(--ink-dim);}
.qrow{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line);cursor:pointer;}
.qrow:last-child{border-bottom:none;}
.qrow:hover{background:var(--surface-2);margin:0 -10px;padding-left:14px;padding-right:14px;border-radius:8px;}
.qrow .qtext{flex:1;font-size:.93rem;}
.qrow .qnum{color:var(--ink-dim);font-size:.78rem;font-family:var(--mono);width:22px;flex-shrink:0;}
.btn{background:var(--accent);color:var(--accent-ink);border:none;border-radius:8px;padding:10px 18px;font-weight:600;font-size:.88rem;}
.btn:hover{filter:brightness(1.08);}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);}
.btn.ghost:hover{background:var(--surface-2);}
.btn.sm{padding:6px 12px;font-size:.8rem;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.filterbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
.fchip{border:1px solid var(--line);background:var(--surface);color:var(--ink-dim);border-radius:99px;padding:6px 14px;font-size:.82rem;font-weight:500;}
.fchip.active{background:var(--ink);color:var(--bg);border-color:var(--ink);}
:root[data-theme="dark"] .fchip.active, @media (prefers-color-scheme:dark){.fchip.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}}
textarea{width:100%;font-family:var(--sans);font-size:.95rem;border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface);color:var(--ink);resize:vertical;line-height:1.55;}
textarea.code{font-family:var(--mono);font-size:.86rem;background:var(--surface-2);tab-size:2;white-space:pre;}
.rulebox{border:1px solid var(--line);border-left:3px solid var(--critical);background:var(--surface);border-radius:10px;padding:16px 18px;margin-bottom:12px;}
.rulebox h3{font-size:1rem;margin-bottom:4px;}
.rulebox .why{color:var(--ink-dim);font-size:.86rem;margin-top:6px;}
.rulebox .apply{font-size:.86rem;margin-top:8px;background:var(--surface-2);border-radius:8px;padding:8px 12px;font-family:var(--mono);}
.pill-banner{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-size:.82rem;color:var(--ink-dim);margin-bottom:20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.pill-banner b{color:var(--ink);}
.kpoint{display:flex;gap:8px;align-items:flex-start;font-size:.88rem;margin-bottom:6px;color:var(--ink-dim);}
.kpoint.hit{color:var(--good);}
.scorewrap{display:flex;align-items:baseline;gap:10px;margin:16px 0;}
.scorewrap .big{font-family:var(--serif);font-size:2.4rem;font-variant-numeric:tabular-nums;}
.testcase{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;font-family:var(--mono);font-size:.82rem;}
.testcase.pass{border-color:color-mix(in srgb, var(--good) 40%, var(--line));background:color-mix(in srgb, var(--good) 8%, transparent);}
.testcase.fail{border-color:color-mix(in srgb, var(--critical) 40%, var(--line));background:color-mix(in srgb, var(--critical) 8%, transparent);}
.badge-status{font-weight:700;font-family:var(--sans);}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;}
.tab{padding:9px 16px;font-size:.88rem;font-weight:600;color:var(--ink-dim);border-bottom:2px solid transparent;background:none;border-top:none;border-left:none;border-right:none;margin-bottom:-1px;}
.tab.active{color:var(--ink);border-bottom-color:var(--accent);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media (max-width:640px){.grid2{grid-template-columns:1fr;}}
.timer{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:1.1rem;background:var(--surface-2);padding:6px 14px;border-radius:8px;}
.nudge{background:color-mix(in srgb, var(--accent) 18%, var(--surface));border:1px solid var(--accent);border-radius:10px;padding:12px 16px;font-size:.86rem;margin-bottom:14px;}
.hintline{font-size:.85rem;color:var(--ink-dim);border-left:2px solid var(--line);padding-left:10px;margin-top:6px;}
.progresslist .row{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);font-size:.9rem;}
.empty{color:var(--ink-dim);font-size:.9rem;padding:30px 0;text-align:center;}
select,option{font-family:var(--sans);}
.mcq label{display:block;padding:9px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:7px;font-size:.88rem;cursor:pointer;}
.mcq label:hover{background:var(--surface-2);}
code.inline{font-family:var(--mono);background:var(--surface-2);padding:1px 6px;border-radius:4px;font-size:.86em;}
pre.code-block{font-family:var(--mono);font-size:.82rem;background:var(--surface-2);padding:12px 14px;border-radius:8px;overflow-x:auto;white-space:pre;}
hr.sep{border:none;border-top:1px solid var(--line);margin:20px 0;}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ---------------- DATA ---------------- */
const categoryMeta = {
  background:'Communication & Background',
  finai:'AI Design in Financial Services',
  retirement:'Retirement & Financial UX',
  design:'Design Systems & Accessibility'
};

const questionBank = [
  {id:1,cat:'background',
    prompt:"Introduce yourself.",
    keyPoints:[
      {k:'20 years / breadth of UX + research',re:/(20|twenty) year/i},
      {k:'Names a relevant AI/conversational project',re:/pepperbot|pepper ?ai/i},
      {k:'Names financial/compliance-adjacent work',re:/nehas|compliance|banking/i},
      {k:'Mentions multiple form factors',re:/mobile|wearable|virtual reality|web/i}
    ],
    perf:{status:'strong',note:"Landed cleanly — hit background, Pepperbot, Meta AI, Nehas, and form factors in one breath. Keep this exact shape."},
    model:"20 years across UX design and research, most recently founding Pepperbot — a Spotify-integrated concierge assistant — plus AI-moderation work on Meta's Messenger and an AI compliance tool (Nehas) for banking disclosures. Designed across mobile, web, wearables, and VR. That range is exactly why financial-AI UX — trust, compliance, conversational interfaces — is where I want to be next."},

  {id:2,cat:'finai',
    prompt:"What specific strategies did you implement in your design for AI-powered conversational interfaces at Pepper AI to ensure usability and trust among users, and how did these strategies align with the compliance requirements typically found in financial services?",
    keyPoints:[
      {k:'Intent-mapping / topic routing mechanism',re:/intent|topic/i},
      {k:'A trust-building moderator/handler concept',re:/moderat|handler|proctor|chatgpt/i},
      {k:'Qualitative research validating trust',re:/qualitative|interview|research/i},
      {k:'Explicitly bridges to financial compliance (the 2nd half of the question)',re:/disclos|complian|regulat|financial service/i}
    ],
    perf:{status:'weak',note:"Good on the Pepperbot mechanics (intents, ChatGPT as 'friendly handler', qualitative research) but you flagged that Pepperbot isn't financial and then never closed the loop the question actually asked for: how would that translate to compliance requirements. Always answer both halves."},
    model:"Pepperbot used intent-mapped topic routing, with ChatGPT acting as a trust moderator — stepping in when the user drifted off-topic or showed friction — validated through iterative qualitative interviews on pain points. Adapting that to financial services, I'd add a compliance layer on top: the moderator would also watch for regulated topics (advice, guarantees) and trigger a disclosure or human handoff at that moment, so trust-building and compliance share the same intervention point instead of being bolted on separately."},

  {id:3,cat:'finai',
    prompt:"AI design in finance/legal asks for inline disclosures when AI uses external data. How would you design this for minimal friction in chat and card UIs?",
    keyPoints:[
      {k:'Microcopy synthesized from full legal text',re:/microcopy|synthes/i},
      {k:'Plain-language / layman translation',re:/layman|plain language|translat/i},
      {k:'Card UI with link to full disclosure',re:/card/i},
      {k:'Names friction reduction explicitly',re:/friction/i}
    ],
    perf:{status:'strong',note:"Solid, specific answer — microcopy synthesis, plain-language translation, card UI with a link out. This is your strongest financial-UX mechanism; reuse this exact pattern name in later answers (you didn't, in Q9, and it cost you consistency)."},
    model:"Microcopy synthesized from the full legal disclosure, rewritten in plain language, surfaced inline via a card UI — short explanation plus a link to the full text. That keeps the chat flow uninterrupted while the disclosure stays one tap away, and it's auditable because the microcopy is versioned against the source text it was synthesized from."},

  {id:4,cat:'finai',
    prompt:"How do you manage versioning of prompts, models, and UI patterns so you can attribute changes in outcomes to specific components?",
    keyPoints:[
      {k:'Version IDs / changelog for prompts & components',re:/version|audit trail|changelog/i},
      {k:'Explicit attribution mechanism (the actual ask)',re:/attribut|experiment id|a\/?b test/i},
      {k:'Metrics dashboard tied to component/version',re:/dashboard|metric/i},
      {k:'Governance/moderation process',re:/moderat|curator|governance/i}
    ],
    perf:{status:'weak',note:"You described a governance process (an 'AI moderator' tracking changes) but never answered the actual question: HOW do you attribute an outcome change to a specific component. That word — attribute — was the ask. Needs a concrete mechanism: version IDs tied to experiment IDs tied to a metrics dashboard."},
    model:"Every prompt, model, and UI pattern gets a version ID with an audit trail of author and change summary — that's the governance layer. Attribution is the missing piece: each version ships behind an experiment ID, so when a metric moves, I can trace it to the exact version that was live, via an A/B or staged rollout rather than a single global change. The dashboard shows metric-by-version, not just metric-by-time, which is what makes attribution possible instead of just plausible."},

  {id:5,cat:'retirement',
    prompt:"Your AI suggests rebalancing, but the window is closed. How would you design real-time eligibility checks and alternative next steps?",
    keyPoints:[
      {k:'Real-time eligibility check before showing the action',re:/eligibility|check.*(before|first)|verify/i},
      {k:'Graceful fallback messaging explaining why blocked',re:/explain|why|reason/i},
      {k:'Concrete alternative next steps offered',re:/schedule|alert|review.*allocat|next step/i},
      {k:'Preserves trust / avoids dead end',re:/trust/i}
    ],
    perf:{status:'missed',note:"CRITICAL: you asked the AI interviewer to clarify the scenario. It explained — then moved straight to the next question without ever letting you answer. This produced a full zero on a core retirement-UX question. This is rule #1 for the retake: never stop to ask what a scenario means — state your read of it in one sentence and answer."},
    model:"I'd run an eligibility check before ever surfacing the suggestion — confirm the account supports rebalancing right now, given market hours and account restrictions. If the window's closed, the AI doesn't just go silent: it explains why in plain language, tells the user exactly when the window reopens, offers to schedule the rebalance for that moment or set an alert, and in the meantime surfaces adjacent actions they *can* take — like reviewing current allocations. The goal is the suggestion never dead-ends; it always resolves to a next step the user can act on now."},

  {id:6,cat:'design',
    prompt:"You are tasked with unifying AI interaction patterns across mobile and web. What core components would you define, and how would you enforce consistency across pods?",
    keyPoints:[
      {k:'Cross-team governance body (committee)',re:/committee|panel/i},
      {k:'Platform-specific libraries (not one-size-fits-all)',re:/separat|mobile.*web|web.*mobile/i},
      {k:'AI-assisted audit trail for the pattern library',re:/audit|track/i},
      {k:'Usage/relevance metrics + dashboard',re:/dashboard|relevance|usage score/i}
    ],
    perf:{status:'strong',note:"Solid structure: interaction-patterns committee, platform-separated libraries, AI-tracked contributions, relevance/usage dashboard. One of your more complete answers."},
    model:"I'd stand up an interaction-patterns committee spanning design and research across pods, meeting regularly to review real usage — not spec in the abstract. Pattern libraries stay separate for web and mobile since the affordances genuinely differ, but both are tracked by the same AI-assisted audit system: every addition logs an author, a consistency check against similar components, and a relevance/usage score tied to real product metrics, surfaced on a shared dashboard so pods see drift before it becomes fragmentation."},

  {id:7,cat:'design',
    prompt:"You're launching a pilot. How would you select participant cohorts, define success metrics for behavior change, and design the feedback loop in product?",
    keyPoints:[
      {k:'Cohort segmentation criteria (income/investment/generation)',re:/segment|income|generation|cohort/i},
      {k:'Structured multi-week research plan',re:/week|phase/i},
      {k:'Cross-functional visibility/ceremonies',re:/cross-function|ceremon|product owner/i},
      {k:'Synthesis tied back to business metrics',re:/business metric|actionable/i}
    ],
    perf:{status:'strong',note:"This was your best answer of both interviews — a clean week-by-week structure (segment → hypothesis → questionnaire → sessions → synthesis) with cross-functional visibility throughout. Use this exact staged-plan shape as your template for every other answer."},
    model:"Cohorts come from working with data science to segment by income, investment level, or generation — picking segments with enough contrast to actually reveal behavior differences. I'd run it as a structured six-week study: week 1 aligning on segments and metrics, week 2 defining hypotheses, week 3 building the interview guide, then qualitative sessions with recorded responses, cross-functional teams invited to observe. I'd close each week with a short synthesis report, and at the end connect the insights directly to the business metrics the team already tracks — so findings turn into prioritized changes, not just a readout."},

  {id:8,cat:'finai',
    prompt:"Contact center agents sometimes provide off-policy help. How would you design AI prompts and safeguards to keep interactions compliant without slowing agents?",
    keyPoints:[
      {k:'Joint guidelines with compliance/policy/disclosure teams',re:/compliance team|policy team|guideline/i},
      {k:'Prompt-level detection of risky phrases/topics',re:/key phrase|risk|detect/i},
      {k:'Real-time alert/guardrail without blocking agent',re:/real-?time|alert|guardrail/i},
      {k:'Escalation or confidence-threshold mechanism',re:/escalat|threshold|human/i}
    ],
    perf:{status:'weak',note:"Reasonable but generic — guidelines plus prompt detection plus alerts. It's missing a concrete escalation/confidence-threshold mechanism, and it doesn't reuse the audit-trail idea from Q4, which would've made the answer feel like one coherent system instead of five separate ideas."},
    model:"I'd co-develop the guardrail guidelines with compliance and policy teams, then encode them as prompt-level detectors for risky phrases and topics. When one fires, the agent gets a real-time inline nudge — not a blocker — so speed isn't sacrificed; if confidence in the risk is high, it escalates to a supervisor alert instead of just a nudge. Every flagged interaction logs to the same audit trail I'd use for prompt versioning, so compliance can see patterns over time, not just single incidents."},

  {id:9,cat:'retirement',
    prompt:"You need to explain rebalancing versus reallocating. How do you test and ship a microcopy and visualization update under compliance review timelines?",
    keyPoints:[
      {k:'Plain-language drafting process',re:/plain language|draft/i},
      {k:'Validation via user testing/A-B',re:/a\/?b test|user stud/i},
      {k:'Compliance review navigation (documentation/approvals)',re:/complian.*review|approval|legal/i},
      {k:'Reuses own earlier microcopy/card pattern (consistency)',re:/card|microcopy/i}
    ],
    perf:{status:'weak',note:"You asked for clarification again here — second time this cost you tempo. The answer you gave afterward (draft → A/B test → navigate compliance) was correct but generic, and never referenced the microcopy/card-UI pattern you'd already established in Q3. Reusing your own frameworks makes you sound like you have a system, not a list of one-offs."},
    model:"Same pattern as my disclosure approach: draft plain-language microcopy distinguishing rebalancing from reallocating, test comprehension via A/B or moderated user studies, then route through compliance with the documentation and approval trail already built into how I version disclosures. Because it reuses an existing reviewed pattern rather than inventing new language from scratch, the compliance review is faster — they're validating a variation, not a new concept."},

  {id:10,cat:'design',
    prompt:"Advisors want dense dashboards, while participants need simplicity. How would you design a pattern that reuses underlying AI insights but renders them differently for each audience?",
    keyPoints:[
      {k:'Shared data layer, differentiated rendering',re:/same.*insight|underlying|shared/i},
      {k:'Concrete UI mechanism named (view switch, progressive disclosure, presets)',re:/switch|toggle|progressive disclosure|preset|default view/i},
      {k:'Prioritization method for what to surface',re:/priorit|matrix/i},
      {k:'Validated with real usage/preference data',re:/research|exercise|preference|usage/i}
    ],
    perf:{status:'weak',note:"Trailed off with an uncertain 'Yeah.' at the end — avoid that; end on the strongest sentence, not a hedge. The idea (priority matrix, personalized dashboards, switchable view) is right but stayed abstract — name the actual UI mechanism (e.g. a saved view toggle with progressive disclosure) instead of just 'personalized dashboards.'"},
    model:"Both views pull from the same underlying AI insight layer — only the rendering differs. I'd build a priority matrix of which elements matter most to each audience, then implement it as a saved-view toggle: participants default to a simplified summary view with progressive disclosure to expand detail on demand, advisors default to the dense view with everything surfaced. I'd validate the default assignment with real usage data, not just assumption — if a 'simple' user keeps expanding the same three metrics, that's a signal to promote them into their default view."},

  {id:11,cat:'design',
    prompt:"You're asked to expose training data summaries to participants. How do you design an understandable, non-technical provenance view?",
    keyPoints:[
      {k:'Fact-checking/vetting process before display',re:/fact.?check|vet/i},
      {k:'Jargon-to-plain-language glossary/mapping',re:/glossary|jargon|translat/i},
      {k:'Progressive disclosure mechanism (tooltips etc)',re:/tooltip|progressive disclosure/i},
      {k:'Shows origin/source of the data',re:/origin|source|where.*(came|from)/i}
    ],
    perf:{status:'strong',note:"Good — fact-checking guidelines, a jargon glossary mapped to plain terms, tooltips for progressive disclosure. Consistent with your disclosure pattern from Q3, which is exactly the throughline you want everywhere."},
    model:"Every summary gets fact-checked against source before it's ever shown — no exceptions. I'd maintain a glossary mapping technical/data-science terms to plain-language equivalents, and surface origin ('this comes from X, last updated Y') directly in the view. Depth is layered in through progressive disclosure — tooltips or expandable sections — so a participant sees a plain sentence by default and can drill into the technical explanation only if they want to."},

  {id:12,cat:'finai',
    prompt:"The copilot drafts emails to participants. How do you surface confidence and required disclosures inline in the compose experience?",
    keyPoints:[
      {k:'Inline confidence indicator on the draft',re:/confidence (indicator|score|label)/i},
      {k:'Auto-inserted disclosure blocks',re:/disclos/i},
      {k:'Human review/approval step before send',re:/review|approv|human/i},
      {k:'Audit trail of AI-drafted vs human-edited content',re:/audit|track.*edit|edited/i}
    ],
    perf:{status:'missed',note:"CRITICAL: you asked 'which copilot — Microsoft Copilot?' The interviewer clarified it meant a generic AI drafting assistant — then moved straight to the next question without giving you a chance to actually answer. Same failure pattern as Q5. In an AI-UX role, 'copilot' is a generic term for any AI drafting assistant — default to that reading and go."},
    model:"The compose view shows an inline confidence label on the draft — high/medium/low — tied to how much the AI is inferring versus pulling from verified account data. Any required disclosure gets auto-inserted as a distinct, visually separate block the sender can't silently delete, and low-confidence drafts route through a mandatory human review step before send. Every send logs what the AI drafted versus what the human edited, so we have an audit trail if a disclosure question ever comes up later."},

  {id:13,cat:'retirement',
    prompt:"A participant's account data is partially missing. Describe how the AI surfaces uncertainty, asks clarifying questions, and suggests safe next steps.",
    keyPoints:[
      {k:'Ongoing monitoring/flagging of missing data',re:/monitor|flag/i},
      {k:'Prompts user directly for the missing field',re:/prompt.*user|ask.*update/i},
      {k:'Reassurance on data security',re:/secur|protect/i},
      {k:'Periodic reverification cadence',re:/periodic|six month|regular/i}
    ],
    perf:{status:'strong',note:"Good coverage — monitoring routines, direct prompts for missing fields, security reassurance, periodic reverification. Solid, if a little long; tighten the middle section."},
    model:"Monitoring routines continuously flag missing or stale fields — if income or address data is out of date, the AI prompts the participant directly for it, with clear reassurance that the data is protected. I'd pair that with a periodic reverification cadence — every six months or so — so participants aren't offered financial products based on stale data, and QA reviews flagged accounts to make sure eligibility checks stay accurate in the meantime."},

  {id:14,cat:'retirement',
    prompt:"You're building an investment comparison view. How would you present risk, fees, and historical returns in plain language, with simple visuals that avoid implying that past performance predicts future results?",
    keyPoints:[
      {k:'Neutral, non-prescriptive language',re:/neutral/i},
      {k:'Explicit disclaimer against predictive framing',re:/predict|future result|past performance/i},
      {k:'Plain-language explanation of numbers',re:/plain language/i},

/* ---------------- SCORING ENGINE ---------------- */
const CLARIFY_RE = /what do you mean|can you elaborate|could you clarify|not sure what|elaborate a little|which .*\?/i;
const FILLER_RE = /\b(um|uh|you know|sort of|kind of|basically)\b/gi;

function scoreAnswer(q, text){
  const clean = (text||'').trim();
  const words = clean.split(/\s+/).filter(Boolean);
  const clarifyFlag = CLARIFY_RE.test(clean);
  const fillerHits = (clean.match(FILLER_RE)||[]).length;
  const hits = q.keyPoints.map(kp=>({...kp, hit:kp.re.test(clean)}));
  const hitCount = hits.filter(h=>h.hit).length;
  let score = (hitCount/q.keyPoints.length)*7; // up to 7 for content coverage
  if(words.length>=35) score += 1.2; else if(words.length<15) score -= 1;
  if(!clarifyFlag) score += 1; else score -= 3;
  if(fillerHits<=1) score += 0.8; else if(fillerHits>=4) score -= 0.8;
  score = Math.max(0, Math.min(10, score));
  return {score:Math.round(score*10)/10, hits, clarifyFlag, fillerHits, wordCount:words.length};
}

function deepEqUnordered(a,b){
  // arrays of arrays (triplets) compared ignoring outer order
  if(Array.isArray(a[0])||Array.isArray(b[0])||(a.length===0&&b.length===0)){
    const norm = arr => arr.map(t=>JSON.stringify(t)).sort();
    const na = norm(a), nb = norm(b);
    return JSON.stringify(na)===JSON.stringify(nb);
  }
  return JSON.stringify(a)===JSON.stringify(b);
}
function runUserFn(entryName, code, argsList){
  let fn;
  try{
    fn = new Function(code + `\nreturn ${entryName};`)();
    if(typeof fn !== 'function') throw new Error(`No function named ${entryName} found.`);
  }catch(e){ return argsList.map(()=>({error:e.message})); }
  return argsList.map(args=>{
    try{ return {value: fn(...args)}; }
    catch(e){ return {error:e.message}; }
  });
}

    ${q.perf ? `<div class="hintline" style="margin:10px 0 4px;">${chipFor(q.perf.status)} <span style="margin-left:6px;">Last time: ${esc(q.perf.note)}</span></div>` : ''}
    <div style="margin:14px 0;">
      <div style="font-size:.8rem;color:var(--ink-dim);margin-bottom:6px;">A strong answer covers:</div>
      ${q.keyPoints.map(kp=>`<div class="kpoint ${saved && saved.hits && saved.hits.find(h=>h.k===kp.k && h.hit) ? 'hit':''}">• ${esc(kp.k)}</div>`).join('')}
    </div>
    <textarea id="answerBox" rows="7" placeholder="Type or paste your answer here...">${saved?esc(saved.text):''}</textarea>
    <div style="display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;">
      <button class="btn" onclick="submitAnswer(${q.id})">Submit for feedback</button>
      <button class="btn ghost" onclick="prevQuestion()" ${idxInList<=0?'disabled':''}>← Prev</button>
      <button class="btn ghost" onclick="nextQuestion()" ${idxInList>=list.length-1?'disabled':''}>Next →</button>
    </div>
    ${saved ? renderFeedback(q, saved) : ''}
  </div>`;
}

function renderFeedback(q, res){
  const pct = Math.round(res.score*10);
  const color = res.score>=7?'var(--good)':res.score>=4.5?'var(--accent)':'var(--critical)';
  return `
  <hr class="sep">
  <div class="scorewrap"><span class="big" style="color:${color}">${res.score}</span><span style="color:var(--ink-dim);">/ 10</span></div>
  ${res.clarifyFlag ? `<div class="rulebox" style="border-left-color:var(--critical);"><b>Flagged:</b> this reads like you're asking the interviewer to clarify. In the real format that can forfeit the whole question — rephrase as a stated assumption instead.</div>` : ''}
  <div style="margin:12px 0;">
    ${res.hits.map(h=>`<div class="kpoint ${h.hit?'hit':''}">${h.hit?'✓':'✗'} ${esc(h.k)}</div>`).join('')}
  </div>
  <p style="font-size:.85rem;color:var(--ink-dim);">${res.wordCount} words · ${res.fillerHits} filler word${res.fillerHits===1?'':'s'} detected</p>
  <button class="btn ghost sm" onclick="toggleModel(${q.id})">Show model answer</button>
  <div id="model-${q.id}" style="display:none;margin-top:10px;"><p style="font-size:.9rem;">${esc(q.model)}</p></div>`;
}

function viewCoding(){
  const tabs = `<div class="tabs">
    <button class="tab ${state.coding.tab==='primer'?'active':''}" onclick="setCodingTab('primer')">JS Syntax Primer</button>
    <button class="tab ${state.coding.tab==='drills'?'active':''}" onclick="setCodingTab('drills')">Warm-up Drills</button>
    <button class="tab ${state.coding.tab==='real'?'active':''}" onclick="setCodingTab('real')">The Two Real Problems</button>
  </div>`;
  if(state.coding.tab==='primer') return `<div class="eyebrow">Coding Lab</div><h1>JS Syntax Primer</h1><p class="sub">Everything here is JavaScript. If Java or Dart/Flutter is the last language you touched, this maps what you already know onto JS syntax — start here before the drills.</p>${tabs}${renderPrimer()}`;
  if(state.coding.tab==='drills') return `<div class="eyebrow">Coding Lab</div><h1>Warm-up Drills</h1><p class="sub">Syntax, operators, function outputs, arrays, and linear search — the fundamentals underneath both real interview problems.</p>${tabs}${renderDrill()}`;
  return `<div class="eyebrow">Coding Lab</div><h1>The Two Real Problems</h1><p class="sub">Verbatim from your Berribot technical assessment. Both went unanswered live — this is where that gets fixed.</p>${tabs}${renderProblem()}`;
}

function renderPrimer(){
  return syntaxPrimer.map(c=>`
    <div class="card">
      <h3 style="font-size:1rem;">${esc(c.title)}</h3>
      <pre class="code-block">${esc(c.js)}</pre>
      <p style="font-size:.86rem;color:var(--ink-dim);margin:8px 0 0;">${esc(c.note)}</p>
    </div>`).join('');
}

function renderDrill(){
  const d = drills[state.coding.drillIdx];
  const done = state.drillDone[d.id];
  let body;
  if(d.mcq){
    const chosen = state.coding.results[d.id]?.chosen;
    body = `<div class="mcq">${d.options.map(o=>`<label><input type="radio" name="mcq" value="${esc(o)}" ${chosen===o?'checked':''} onchange="answerMcq('${d.id}','${esc(o)}')"> ${esc(o)}</label>`).join('')}</div>`;
    if(chosen!==undefined){
      const correct = chosen===d.answer;
      body += `<div class="testcase ${correct?'pass':'fail'}"><span class="badge-status">${correct?'✓ Correct':'✗ Not quite'}</span><span>Answer: ${esc(d.answer)}</span></div>`;
    }
  } else {
    const code = state.coding.code[d.id] ?? d.starter;
    const results = state.coding.results[d.id];
    body = `<textarea class="code" rows="6" oninput="editCode('${d.id}', this.value)">${esc(code)}</textarea>
    <div style="display:flex;gap:10px;margin:10px 0;">
      <button class="btn sm" onclick="runDrill('${d.id}')">Run tests</button>
    </div>
    ${results ? results.map((r,i)=>`<div class="testcase ${r.pass?'pass':'fail'}"><span>${JSON.stringify(d.tests[i])} → expected ${JSON.stringify(d.expected[i])}</span><span class="badge-status">${r.pass?'✓ pass':(r.error?'error: '+esc(r.error):'✗ got '+JSON.stringify(r.got))}</span></div>`).join('') : ''}`;
  }
  const nav = drills.map((dr,i)=>`<button class="fchip ${i===state.coding.drillIdx?'active':''}" onclick="gotoDrill(${i})">${state.drillDone[dr.id]?'✓ ':''}${esc(dr.title)}</button>`).join('');
  return `<div class="filterbar">${nav}</div>
  <div class="card">
    <span class="chip cat">${esc(d.cat)}</span>
    <h3 style="margin-top:10px;white-space:pre-wrap;">${esc(d.prompt)}</h3>
    ${body}
    <details style="margin-top:12px;"><summary style="cursor:pointer;font-size:.85rem;color:var(--ink-dim);">Hint</summary><p class="hintline">${esc(d.hint)}</p></details>
  </div>`;
}

function renderProblem(){
  const p = codingProblems[state.coding.probIdx];
  const code = state.coding.code[p.id] ?? p.starter;
  const results = state.coding.results[p.id];
  const nav = codingProblems.map((pp,i)=>`<button class="fchip ${i===state.coding.probIdx?'active':''}" onclick="gotoProblem(${i})">${esc(pp.title)}</button>`).join('');
  const nudge = (Date.now()-state.coding.lastInput > 90000 && !results) ? `<div class="nudge">Been quiet a while — say your plan out loud, even a brute-force idea. That alone beats what happened live on this exact problem.</div>` : '';
  return `<div class="filterbar">${nav}</div>
  <div class="card">
    <span class="chip cat">${esc(p.pattern)}</span>
    <h3 style="margin-top:10px;">${esc(p.title)}</h3>
    <p style="white-space:pre-wrap;font-size:.92rem;">${esc(p.prompt)}</p>
    <details open style="margin:14px 0;"><summary style="cursor:pointer;font-weight:600;font-size:.88rem;">Guided breakdown</summary>
      <ol style="font-size:.87rem;color:var(--ink-dim);padding-left:20px;">${p.steps.map(s=>`<li style="margin-bottom:6px;">${esc(s)}</li>`).join('')}</ol>
    </details>
    ${nudge}
    <div style="font-size:.8rem;color:var(--ink-dim);margin-bottom:6px;">Narrate your plan (typed) — optional but recommended:</div>
    <textarea rows="2" placeholder="e.g. I'll sort first, then use two pointers..." oninput="touchInput()"></textarea>
    <div style="font-size:.8rem;color:var(--ink-dim);margin:10px 0 6px;">Code:</div>
    <textarea class="code" rows="8" oninput="editCode('${p.id}', this.value); touchInput();">${esc(code)}</textarea>
    <div style="display:flex;gap:10px;margin:12px 0;flex-wrap:wrap;">
      <button class="btn" onclick="runProblem('${p.id}')">Run tests</button>
      <button class="btn ghost" onclick="alert('There is no skip button on purpose. If you\\'re stuck, open the hints below and write the brute-force version \\u2014 that is the fix for what happened live.')">I want to skip</button>
    </div>
    ${results ? results.map((r,i)=>`<div class="testcase ${r.pass?'pass':'fail'}"><span>${JSON.stringify(p.tests[i])}</span><span class="badge-status">${r.pass?'✓ pass':(r.error?'error: '+esc(r.error):'✗ got '+JSON.stringify(r.got))}</span></div>`).join('') : ''}
    <details style="margin-top:12px;"><summary style="cursor:pointer;font-size:.85rem;color:var(--ink-dim);">Hints</summary>${p.hints.map(h=>`<p class="hintline">${esc(h)}</p>`).join('')}</details>
  </div>`;
}

function viewMock(){
  if(!state.mock.active){
    return `<div class="eyebrow">Timed Mock</div><h1>Full 30-Minute Run-Through</h1>
    <p class="sub">All 14 questions plus both coding problems, back to back, on the clock — mirrors the real Berribot format. The Golden Rules banner stays pinned throughout.</p>
    <div class="card"><button class="btn" onclick="startMock()">Start 30:00 mock interview</button></div>`;
  }
  const items = [...questionBank, ...codingProblems];
  const item = items[state.mock.idx];
  const isCoding = !!item.entry;
  const mm = String(Math.floor(state.mock.seconds/60)).padStart(2,'0');
  const ss = String(state.mock.seconds%60).padStart(2,'0');
  let body;
  if(isCoding){
    const code = state.coding.code['mock_'+item.id] ?? item.starter;
    body = `<h3>${esc(item.title)}</h3><p style="white-space:pre-wrap;font-size:.9rem;">${esc(item.prompt)}</p>
    <textarea class="code" rows="7" oninput="editCode('mock_${item.id}', this.value)">${esc(code)}</textarea>`;
  } else {
    body = `<span class="chip cat">${categoryMeta[item.cat]}</span><h3 style="margin-top:8px;">${esc(item.prompt)}</h3>
    <textarea rows="6" oninput="state.mock.log[${state.mock.idx}]=this.value" placeholder="Answer...">${esc(state.mock.log[state.mock.idx]||'')}</textarea>`;
  }
  return `
  <div class="pill-banner"><b>Never ask for clarification.</b> State your read and answer. <b>Never skip coding.</b> Brute force beats silence.</div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
    <span style="color:var(--ink-dim);font-size:.85rem;">Item ${state.mock.idx+1} of ${items.length}</span>
    <span class="timer">${mm}:${ss}</span>
  </div>
  <div class="card">${body}
    <div style="margin-top:14px;display:flex;gap:10px;">
      <button class="btn" onclick="mockNext()">${state.mock.idx>=items.length-1?'Finish':'Next →'}</button>
      <button class="btn ghost" onclick="endMock(true)">Exit</button>
    </div>
  </div>`;
}

function viewHistory(){
  const h = loadHistory();
  if(!h.length) return `<div class="eyebrow">Progress History</div><h1>History</h1><div class="empty">No sessions saved yet. Finish a mock run to see it here.</div>`;
  return `<div class="eyebrow">Progress History</div><h1>History</h1>
  <div class="card progresslist">${h.map(e=>`<div class="row"><span>${esc(e.date)} · ${esc(e.mode)}</span><span>${e.summary}</span></div>`).join('')}</div>`;
}

/* ---------------- ACTIONS ---------------- */
function setView(v){ state.view=v; render(); window.scrollTo(0,0); }
function gotoQuestion(id){ const idx = questionBank.findIndex(q=>q.id===id); const q=questionBank[idx]; state.practice.cat='all'; state.practice.idx=idx; setView('practice'); }
function toggleSprint(id){ state.sprint[id] = !state.sprint[id]; localStorage.setItem(LS_SPRINT, JSON.stringify(state.sprint)); render(); }
function goSprintItem(id){
  const item = sprintPlan.flatMap(p=>p.items).find(i=>i.id===id);
  if(!item) return;
  if(item.qid) return gotoQuestion(item.qid);
  if(item.view==='coding' && item.tab) state.coding.tab = item.tab;
  setView(item.view);
}
function setPracticeCat(c){ state.practice.cat=c; state.practice.idx=0; render(); }
function nextQuestion(){ state.practice.idx++; render(); }
function prevQuestion(){ state.practice.idx--; render(); }
function submitAnswer(qid){
  const q = questionBank.find(x=>x.id===qid);
  const text = document.getElementById('answerBox').value;
  const res = scoreAnswer(q, text);
  state.session.answers[qid] = {text, ...res};
  render();
}
function toggleModel(qid){ const el=document.getElementById('model-'+qid); el.style.display = el.style.display==='none'?'block':'none'; }

function setCodingTab(t){ state.coding.tab=t; render(); }
function gotoDrill(i){ state.coding.drillIdx=i; render(); }
function gotoProblem(i){ state.coding.probIdx=i; render(); }
function editCode(id, val){ state.coding.code[id]=val; }
function touchInput(){ state.coding.lastInput = Date.now(); }
function answerMcq(id, val){ state.coding.results[id]={chosen:val}; if(val===drills.find(d=>d.id===id).answer){ state.drillDone[id]=true; localStorage.setItem(LS_DRILLS, JSON.stringify(state.drillDone)); } render(); }
function runDrill(id){
  const d = drills.find(x=>x.id===id);
  const code = state.coding.code[id] ?? d.starter;
  const outs = runUserFn(d.title, code, d.tests);
  const results = outs.map((o,i)=>({pass: !o.error && JSON.stringify(o.value)===JSON.stringify(d.expected[i]), got:o.value, error:o.error}));
  state.coding.results[id]=results;
  if(results.every(r=>r.pass)){ state.drillDone[id]=true; localStorage.setItem(LS_DRILLS, JSON.stringify(state.drillDone)); }
  render();
}
function runProblem(id){
  const p = codingProblems.find(x=>x.id===id);
  const code = state.coding.code[id] ?? p.starter;
  const outs = runUserFn(p.entry, code, p.tests);
  const results = outs.map((o,i)=>{
    if(o.error) return {pass:false, error:o.error};
    const exp = p.expected[i];
    const pass = Array.isArray(exp) && Array.isArray(exp[0]!==undefined && exp) ? deepEqUnordered(o.value||[], exp) : JSON.stringify(o.value)===JSON.stringify(exp);
    return {pass, got:o.value};
  });
  state.coding.results[id]=results;
  render();
}

function startMock(){
  state.mock = {active:true, idx:0, seconds:1800, timerId:null, log:[]};
  state.mock.timerId = setInterval(()=>{
    state.mock.seconds--;
    if(state.mock.seconds<=0){ clearInterval(state.mock.timerId); endMock(false); return; }
    if(state.view==='mock'){ const t=document.querySelector('.timer'); if(t){const mm=String(Math.floor(state.mock.seconds/60)).padStart(2,'0');const ss=String(state.mock.seconds%60).padStart(2,'0');t.textContent=`${mm}:${ss}`;} }
  },1000);
  setView('mock');
}
function mockNext(){
  const items = [...questionBank, ...codingProblems];
  if(state.mock.idx >= items.length-1){ endMock(false); return; }
  state.mock.idx++; render();
}
function endMock(exited){
  if(state.mock.timerId) clearInterval(state.mock.timerId);
  const elapsedMin = Math.round((1800-state.mock.seconds)/60);
  saveHistoryEntry({date:new Date().toLocaleString(), mode: exited?'Mock (exited early)':'Mock (completed)', summary:`${state.mock.idx+1} items · ${elapsedMin} min`});
  state.mock = {active:false, idx:0, seconds:1800, timerId:null, log:[]};
  setView('history');
}

/* silence-nudge ticker for the real-problems coding view */
setInterval(()=>{ if(state.view==='coding' && state.coding.tab==='real'){ render(); } }, 15000);
/* countdown ticker for the debrief view */
setInterval(()=>{ if(state.view==='debrief'){ render(); } }, 30000);

/* ---------------- SHELL / NAV ---------------- */
function navBtn(view, label){ return `<button class="nav-btn ${state.view===view?'active':''}" onclick="setView('${view}')">${label}</button>`; }
function render(){
  const app = document.getElementById('app');
  let body;
  if(state.view==='debrief') body = viewDebrief();
  else if(state.view==='rules') body = viewRules();
  else if(state.view==='practice') body = viewPractice();
  else if(state.view==='coding') body = viewCoding();
  else if(state.view==='mock') body = viewMock();
  else if(state.view==='history') body = viewHistory();
  app.innerHTML = `
  <div class="shell">
    <nav class="rail">
      <div class="brand">Berribot Retake</div>
      ${navBtn('debrief','Debrief')}
      ${navBtn('rules','Golden Rules')}
      ${navBtn('practice','Practice Q&amp;A')}
      ${navBtn('coding','Coding Lab')}
      ${navBtn('mock','Timed Mock')}
      ${navBtn('history','History')}
    </nav>
    <main class="main">${body}</main>
  </div>`;
}
render();
</script>
</body>
</html>
